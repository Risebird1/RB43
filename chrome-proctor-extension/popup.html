<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Risebird Proctoring</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Risebird Proctoring</h1>

    <section id="webAccessBanner" class="web-access-banner" hidden>
      <strong>Cross-site monitoring</strong>
      <p class="web-access-hint">
        Click the button below once so tab switching, screenshots, and blocked-site rules work on any website during the exam.
      </p>
      <button type="button" id="enableWebMonitoring">Allow full tab monitoring</button>
    </section>

    <section>
      <label for="name">Name</label>
      <input id="name" type="text" autocomplete="name" />

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" />

      <label for="token">Session Token</label>
      <input id="token" type="text" autocomplete="off" />

      <label for="interviewId">Interview ID</label>
      <input id="interviewId" type="text" autocomplete="off" />
    </section>

    <section>
      <button type="button" id="joinSession">Join Session</button>
      <button type="button" id="startSession">Start Exam</button>
      <button type="button" id="stopSession" class="secondary">End Exam</button>
    </section>

    <section>
      <label>
        <input type="checkbox" id="clipboardBlocking" />
        Enable clipboard blocking
      </label>
      <button type="button" id="saveSettings" class="secondary">Save Settings</button>
    </section>

    <section>
      <div>Status: <span id="status">-</span></div>
      <div>Violations: <span id="violations">0</span></div>
      <div id="message"></div>
    </section>

    <section>
      <button type="button" id="downloadReport">Download Report</button>
      <button type="button" id="refresh" class="secondary">Refresh</button>
    </section>

    <section>
      <div id="events"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
